<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Tier 0 and Tier 1 Global Standard TPM comparison</title>
  <desc id="desc">A horizontal bar chart comparing tokens per minute for four common models.</desc>
  <style>
    .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .axis { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
    .value { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .grid { stroke: #dadce0; stroke-width: 1; }
    .tier0 { fill: #8ab4f8; }
    .tier1 { fill: #1a73e8; }
  </style>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="title">Global Standard TPM: Tier 0 vs Tier 1</text>
  <rect x="650" y="25" width="14" height="14" rx="2" class="tier0"/>
  <text x="672" y="37" class="axis">Tier 0</text>
  <rect x="745" y="25" width="14" height="14" rx="2" class="tier1"/>
  <text x="767" y="37" class="axis">Tier 1</text>

  <line x1="270" y1="76" x2="270" y2="412" class="grid"/>
  <line x1="390" y1="76" x2="390" y2="412" class="grid"/>
  <line x1="510" y1="76" x2="510" y2="412" class="grid"/>
  <line x1="630" y1="76" x2="630" y2="412" class="grid"/>
  <line x1="750" y1="76" x2="750" y2="412" class="grid"/>
  <line x1="870" y1="76" x2="870" y2="412" class="grid"/>
  <text x="266" y="435" class="axis">0</text>
  <text x="382" y="435" class="axis">1M</text>
  <text x="502" y="435" class="axis">2M</text>
  <text x="622" y="435" class="axis">3M</text>
  <text x="742" y="435" class="axis">4M</text>
  <text x="862" y="435" class="axis">5M</text>

  <text x="40" y="105" class="label">gpt-4.1-mini</text>
  <rect x="270" y="87" width="24" height="18" rx="3" class="tier0"/>
  <text x="302" y="101" class="value">0.2M</text>
  <rect x="270" y="111" width="600" height="18" rx="3" class="tier1"/>
  <text x="878" y="125" class="value">5M</text>

  <text x="40" y="185" class="label">gpt-5-mini</text>
  <rect x="270" y="167" width="60" height="18" rx="3" class="tier0"/>
  <text x="338" y="181" class="value">0.5M</text>
  <rect x="270" y="191" width="120" height="18" rx="3" class="tier1"/>
  <text x="398" y="205" class="value">1M</text>

  <text x="40" y="265" class="label">o4-mini</text>
  <rect x="270" y="247" width="12" height="18" rx="3" class="tier0"/>
  <text x="290" y="261" class="value">0.1M</text>
  <rect x="270" y="271" width="120" height="18" rx="3" class="tier1"/>
  <text x="398" y="285" class="value">1M</text>

  <text x="40" y="345" class="label">text-embedding-3-small</text>
  <rect x="270" y="327" width="120" height="18" rx="3" class="tier0"/>
  <text x="398" y="341" class="value">1M</text>
  <rect x="270" y="351" width="120" height="18" rx="3" class="tier1"/>
  <text x="398" y="365" class="value">1M</text>
</svg>